name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate explicit release overrides
        run: node scripts/changeset-policy.mjs
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: node scripts/changeset-policy.mjs --consistency
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:package
      - run: npm pack --dry-run
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
  visual:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium
      # Advisory: snapshot drift must not fail the workflow. It stays visible as a warning and summary.
      - name: Visual snapshots (advisory)
        id: visual
        run: npm run test:visual
        continue-on-error: true
      - name: Report snapshot drift
        if: steps.visual.outcome == 'failure'
        run: |
          echo "::warning title=Visual snapshots differ::Advisory only. Review the visual-evidence artifact; if the change is intended, run npm run test:visual:update on macOS and commit the reviewed baselines."
          {
            echo "### Visual snapshots differ (advisory, does not fail CI)"
            echo
            echo "Download the **visual-evidence** artifact and review \`*-actual.png\` and \`*-diff.png\`."
            echo "If the change is intended, run \`npm run test:visual:update\` on macOS and commit the reviewed baselines."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-evidence
          path: test-results/
  next-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - run: npm run smoke:next
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:next:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-smoke
          path: artifacts/next/
