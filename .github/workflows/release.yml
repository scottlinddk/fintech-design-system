name: Release
on:
  workflow_dispatch: # retry the committed release without generating a new bump
  push:
    branches: [main]
concurrency: ${{ github.workflow }}-${{ github.ref }}
permissions:
  contents: write
  pull-requests: write
  id-token: write
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changelog entries link the commit and PR that added each changeset
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: node scripts/changeset-policy.mjs --consistency
      - run: npm test
      - run: npm run build
      - name: Default to a minor release unless a changeset specifies otherwise
        if: github.event_name == 'push'
        run: node scripts/prepare-release.mjs
      - uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
