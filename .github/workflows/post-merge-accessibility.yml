name: Post-merge accessibility audit
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accessibility:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright axe-core
          npx playwright install --with-deps chromium
      - name: Run accessibility, keyboard and responsive checks
        run: node scripts/audit-accessibility.cjs
      - name: Upload screenshots and audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-audit
          path: artifacts/accessibility/
          if-no-files-found: warn
